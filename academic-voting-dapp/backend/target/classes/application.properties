# ═══════════════════════════════════════════════════════════════
# Academic Voting Backend — application.properties
# ═══════════════════════════════════════════════════════════════

server.port=8080
spring.application.name=academic-voting-backend

# ── Web3j / Local Node Connection ──────────────────────────────
# JSON-RPC endpoint of the local Hardhat / Anvil node
web3j.client-address=http://127.0.0.1:8545

# Admin account private key (Hardhat/Anvil test key — NEVER use in prod)
# In production: inject via environment variable or a secrets manager.
web3j.admin-private-key=${ADMIN_PRIVATE_KEY:0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}

# Gas settings (Hardhat/Anvil ignores gas price; set sensible defaults)
web3j.gas-price=20000000000
web3j.gas-limit=500000

# ── Deployed Contract Address ───────────────────────────────────
# Set this to the address printed by the deployment script.
app.contract.address=${CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}

# ── Web3j Connection Pool ───────────────────────────────────────
web3j.http-client.max-idle-connections=10
web3j.http-client.keep-alive-duration-minutes=5
web3j.http-client.connection-timeout-seconds=10
web3j.http-client.read-timeout-seconds=30

# ── Actuator ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ────────────────────────────────────────────────────
logging.level.org.web3j=INFO
logging.level.com.university=DEBUG
